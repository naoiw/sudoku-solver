name: Deploy to GitHub Pages

# GitHub Pages publishes one artifact per site. Build main at the site root
# and develop in /develop/ so preview updates never replace production.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: preview

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            production/pnpm-lock.yaml
            preview/pnpm-lock.yaml

      - name: Install production dependencies
        working-directory: production
        run: pnpm install --frozen-lockfile

      - name: Install preview dependencies
        working-directory: preview
        run: pnpm install --frozen-lockfile

      - name: Build production site
        working-directory: production
        run: pnpm build

      - name: Typecheck preview site
        working-directory: preview
        run: pnpm exec tsc -b

      - name: Build preview site
        working-directory: preview
        run: pnpm exec vite build --base=/sudoku-solver/develop/

      - name: Combine sites into one Pages artifact
        run: |
          mkdir -p publish/develop
          cp -a production/dist/. publish/
          cp -a preview/dist/. publish/develop/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
