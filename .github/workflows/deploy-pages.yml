name: Deploy to GitHub Pages

# Deployments always run from main so github-pages branch protections remain intact.
# One artifact contains main at / and develop at /develop/.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Validate develop]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Do not publish a failed develop check.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: preview

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            production/pnpm-lock.yaml
            preview/pnpm-lock.yaml

      - name: Install production dependencies
        working-directory: production
        run: pnpm install --frozen-lockfile

      - name: Install preview dependencies
        working-directory: preview
        run: pnpm install --frozen-lockfile

      - name: Build production
        working-directory: production
        run: pnpm build

      - name: Typecheck preview
        working-directory: preview
        run: pnpm exec tsc -b

      - name: Build preview
        working-directory: preview
        run: pnpm exec vite build --base=/sudoku-solver/develop/

      - name: Combine sites into one artifact
        run: |
          mkdir -p publish/develop
          cp -a production/dist/. publish/
          cp -a preview/dist/. publish/develop/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
